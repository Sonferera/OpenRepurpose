[project]
name = "openrepurpose"
version = "0.1.0"
description = "Reproducible in-silico drug repurposing workbench for Neglected Tropical Diseases"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["ml/tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
