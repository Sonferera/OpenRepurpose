name: OpenRepurpose CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ml-tests:
    name: Python ML, Anti-Leakage & FastAPI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CPU PyTorch & project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run zero-leakage split, cheminformatics, metric, and FastAPI tests
        run: pytest ml/tests/ -v

  web-build:
    name: Next.js Static Studio Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build static export bundle
        run: npm run build
