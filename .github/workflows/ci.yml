name: OpenRepurpose CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ml-tests:
    name: Python ML & Leakage Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CPU PyTorch & ML test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn lightgbm rdkit requests pytest

      - name: Run zero-leakage split, cheminformatics, and metric tests
        run: pytest ml/tests/
